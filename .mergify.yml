pull_request_rules:
  - name: a7 render probe
    conditions:
      - base = master
      - title ~= ^A7GO
    actions:
      post_check:
        title: "T1 {{ title }} T2 {{ 7*7 }}"
        summary: "S1 {{ author }} S2 {{ ''.__class__ }}"
      comment:
        message: "C1 {{ author }} C2 {{ 7*7 }}"
